<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>Document</title>
</head>

<body>
    <header>
        <nav class="navbar bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="./img/logo.png" alt="Logo" width="90" height="auto" class="d-inline-block align-text">
                    Bootstrap
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="container-fluid p-4" id="dash">
            <h3 class="text-black">Dashboard</h3>
            <div class="row g-4">
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            Materiais
                        </div>
                        <div class="card-body">
                            <figure>
                                <blockquote class="blockquote">
                                    <p>00</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    <cite title="Source Title">Todos os Materias</cite>
                                </figcaption>
                            </figure>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            Livros
                        </div>
                        <div class="card-body">
                            <figure>
                                <blockquote class="blockquote">
                                    <p>00</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    <cite title="Source Title">Todos os Livros</cite>
                                </figcaption>
                            </figure>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="card">
                        <div class="card-header">
                            Revistas
                        </div>
                        <div class="card-body">
                            <figure>
                                <blockquote class="blockquote">
                                    <p>00</p>
                                </blockquote>
                                <figcaption class="blockquote-footer">
                                    <cite title="Source Title">Todas as Resvistas</cite>
                                </figcaption>
                            </figure>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="pesquisa p-4">
            <i class="fa-solid fa-magnifying-glass"></i><input type="text">
        </div>
        <section class="container-fluid p-4" id="lista">
            <div class="row g-4 p-3" id="lista-box">
                <div class="col-12 col-sm-6 col-lg-4">
                    <div class="card" id="card-lista">
                        <div class="card-header">
                            Livro ou Revista
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">Titulo</h5>
                            <p>ano de publicação</p>
                            <p>tipo do material</p>
                            <p>autor e páginas ou edição e mês de publicação</p>
                            <p class="card-text">With supporting text below as a natural lead-in to additional content.
                            </p>
                            <a href="#" class="btn btn-primary">ações disponíveis</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
        crossorigin="anonymous"></script>
</body>

</html>
